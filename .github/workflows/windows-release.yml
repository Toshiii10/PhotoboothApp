name: Windows application

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Windows release version (major.minor.patch)'
        default: '1.0.0'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Locate or install WiX
        shell: pwsh
        run: |
          if ($env:WIX -and (Test-Path "$env:WIX\bin\candle.exe")) {
            "$env:WIX\bin" >> $env:GITHUB_PATH
          } elseif (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
            $wixBin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\bin' -Directory | Select-Object -First 1
            if (-not $wixBin) { throw 'WiX bin directory not found.' }
            $wixBin.FullName >> $env:GITHUB_PATH
          }
      - name: Build, test and package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_KIND: ${{ github.ref_type }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = '1.0.0'
          if ($env:INPUT_VERSION) { $version = $env:INPUT_VERSION }
          if ($env:RELEASE_KIND -eq 'tag') { $version = $env:RELEASE_TAG -replace '^v', '' }
          ./scripts/build-windows.ps1 -Version $version -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: photobooth-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: photobooth-windows-x64
          path: dist
      - name: Prepare release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "Photobooth Studio $RELEASE_TAG" --notes "Windows x64 installer and portable ZIP. Java is bundled. Review the clean-PC checklist in README.md before publishing."
